<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shrivi Creations | Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#f9f6f0] text-[#641f2a] antialiased">

    <div class="max-w-7xl mx-auto px-4 py-10">
        <div class="flex justify-between items-center mb-8 border-b border-[#641f2a]/20 pb-4">
            <div>
                <h1 class="text-3xl font-serif font-bold uppercase">Shrivi Admin Panel</h1>
                <p class="text-xs text-stone-600">Manage store inventory and view live customer orders.</p>
            </div>
            <a href="/" class="px-5 py-2.5 bg-[#641f2a] text-white text-xs uppercase font-bold rounded-full">Back to Store</a>
        </div>

        <!-- Tabs -->
        <div class="flex gap-4 mb-6 border-b border-[#641f2a]/10 pb-3 text-xs font-bold uppercase tracking-wider">
            <button onclick="switchTab('products')" id="tab-prod-btn" class="text-[#641f2a] border-b-2 border-[#641f2a] pb-1">Products Inventory</button>
            <button onclick="switchTab('orders')" id="tab-ord-btn" class="text-[#641f2a]/50 hover:text-[#641f2a] pb-1">Customer Orders</button>
        </div>

        <!-- PRODUCTS TAB -->
        <div id="section-products" class="space-y-8">
            <div class="bg-white p-6 rounded-3xl shadow-md border border-[#641f2a]/10">
                <h2 class="font-serif text-xl font-bold mb-4 uppercase">Add New Product</h2>
                <form id="add-product-form" onsubmit="handleCreateProduct(event)" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <input id="p-id" type="text" placeholder="Product ID (e.g. p8)" required class="bg-[#f9f6f0] border border-[#641f2a]/20 rounded-xl px-4 py-2.5 text-xs">
                    <input id="p-name" type="text" placeholder="Product Name" required class="bg-[#f9f6f0] border border-[#641f2a]/20 rounded-xl px-4 py-2.5 text-xs">
                    <input id="p-price" type="number" placeholder="Price (₹)" required class="bg-[#f9f6f0] border border-[#641f2a]/20 rounded-xl px-4 py-2.5 text-xs">
                    <input id="p-category" type="text" placeholder="Category (Tops / Cardigans / Bags)" required class="bg-[#f9f6f0] border border-[#641f2a]/20 rounded-xl px-4 py-2.5 text-xs">
                    <input id="p-img" type="text" placeholder="Image Filename or URL" required class="bg-[#f9f6f0] border border-[#641f2a]/20 rounded-xl px-4 py-2.5 text-xs sm:col-span-2">
                    <textarea id="p-desc" placeholder="Product Description" rows="2" class="bg-[#f9f6f0] border border-[#641f2a]/20 rounded-xl px-4 py-2.5 text-xs sm:col-span-2"></textarea>
                    <button type="submit" class="sm:col-span-2 py-3 bg-[#641f2a] text-white rounded-full uppercase tracking-widest text-xs font-bold hover:bg-[#4a1720]">Add Product to Database</button>
                </form>
            </div>

            <div class="bg-white p-6 rounded-3xl shadow-md border border-[#641f2a]/10">
                <h2 class="font-serif text-xl font-bold mb-4 uppercase">Current Inventory</h2>
                <div id="admin-products-list" class="space-y-3"></div>
            </div>
        </div>

        <!-- ORDERS TAB -->
        <div id="section-orders" class="hidden space-y-6">
            <div class="bg-white p-6 rounded-3xl shadow-md border border-[#641f2a]/10">
                <h2 class="font-serif text-xl font-bold mb-4 uppercase">Customer Orders</h2>
                <div id="admin-orders-list" class="space-y-4"></div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';

        async function fetchProducts() {
            const res = await fetch(`${API_URL}/products`);
            const products = await res.json();
            const container = document.getElementById('admin-products-list');
            container.innerHTML = products.map(p => `
                <div class="flex items-center justify-between p-4 bg-[#f9f6f0] rounded-2xl border border-[#641f2a]/10">
                    <div class="flex items-center gap-4">
                        <img src="${p.img}" class="w-12 h-14 object-cover rounded-xl bg-white">
                        <div>
                            <p class="font-bold text-xs">${p.name} (${p.id})</p>
                            <p class="text-[10px] text-stone-600">₹${p.price} · ${p.category}</p>
                        </div>
                    </div>
                    <button onclick="deleteProduct('${p.id}')" class="px-3 py-1.5 bg-red-700 text-white text-[10px] uppercase font-bold rounded-xl">Delete</button>
                </div>
            `).join('');
        }

        async function fetchOrders() {
            const res = await fetch(`${API_URL}/orders`);
            const orders = await res.json();
            const container = document.getElementById('admin-orders-list');
            if(orders.length === 0) {
                container.innerHTML = `<p class="text-xs text-stone-500 text-center py-6">No orders received yet.</p>`;
                return;
            }
            container.innerHTML = orders.map(o => `
                <div class="p-4 bg-[#f9f6f0] rounded-2xl border border-[#641f2a]/10 space-y-2">
                    <div class="flex justify-between text-xs font-bold">
                        <span>Order #${o.id}</span>
                        <span class="text-green-700">₹${o.subtotal.toLocaleString()}</span>
                    </div>
                    <p class="text-[11px] text-stone-700"><b>Customer:</b> ${o.customer.name} (${o.customer.phone}, ${o.customer.email})</p>
                    <p class="text-[11px] text-stone-700"><b>Address:</b> ${o.customer.address}</p>
                    <div class="text-[10px] text-stone-600 border-t border-[#641f2a]/10 pt-2">
                        ${o.items.map(i => `${i.name} (x${i.qty}, Size:${i.size})`).join(', ')}
                    </div>
                </div>
            `).join('');
        }

        async function handleCreateProduct(e) {
            e.preventDefault();
            const newProd = {
                id: document.getElementById('p-id').value,
                name: document.getElementById('p-name').value,
                price: parseFloat(document.getElementById('p-price').value),
                category: document.getElementById('p-category').value,
                img: document.getElementById('p-img').value,
                desc: document.getElementById('p-desc').value,
                type: 'image'
            };
            const res = await fetch(`${API_URL}/products`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newProd)
            });
            if(res.ok) {
                alert('Product added successfully!');
                document.getElementById('add-product-form').reset();
                fetchProducts();
            } else {
                alert('Error adding product');
            }
        }

        async function deleteProduct(id) {
            if(confirm('Are you sure you want to delete this product?')) {
                await fetch(`${API_URL}/products/${id}`, { method: 'DELETE' });
                fetchProducts();
            }
        }

        function switchTab(tab) {
            if(tab === 'products') {
                document.getElementById('section-products').classList.remove('hidden');
                document.getElementById('section-orders').classList.add('hidden');
                document.getElementById('tab-prod-btn').className = "text-[#641f2a] border-b-2 border-[#641f2a] pb-1";
                document.getElementById('tab-ord-btn').className = "text-[#641f2a]/50 hover:text-[#641f2a] pb-1";
                fetchProducts();
            } else {
                document.getElementById('section-products').classList.add('hidden');
                document.getElementById('section-orders').classList.remove('hidden');
                document.getElementById('tab-ord-btn').className = "text-[#641f2a] border-b-2 border-[#641f2a] pb-1";
                document.getElementById('tab-prod-btn').className = "text-[#641f2a]/50 hover:text-[#641f2a] pb-1";
                fetchOrders();
            }
        }

        fetchProducts();
    </script>
</body>
</html>
